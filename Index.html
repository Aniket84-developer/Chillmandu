<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hunger End Pro | Night Food Delivery</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-top">
      📞 Call / WhatsApp: 9801988870 &nbsp;|&nbsp; Delivery: 7 PM – 3 AM (NST)
    </div>
    <div class="header-main">
      <a href="index.html" class="logo">
        <div class="logo-icon">🍔</div>
        Hunger End Pro
      </a>
      <nav class="nav">
        <a href="#menu">Menu</a>
        <a href="admin.html">Owner</a>
        <button class="cart-btn" id="openCart">
          🛒 Cart <span class="cart-count" id="cartCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1>Discover your Cravings, We Deliver to you!</h1>
    <p>Fast night delivery in Kathmandu, Bhaktapur & Lalitpur</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search momo, pizza, chicken..." />
      <button id="searchBtn">Search</button>
    </div>
  </section>

  <!-- Categories -->
  <div class="categories" id="categories">
    <button class="cat-btn active" data-cat="all">All</button>
    <button class="cat-btn" data-cat="Foods">Foods</button>
    <button class="cat-btn" data-cat="Bakery">Bakery</button>
    <button class="cat-btn" data-cat="Drinks">Drinks</button>
  </div>

  <!-- Menu -->
  <section class="section" id="menu">
    <h2 class="section-title">🔥 Popular Items</h2>
    <div class="menu-grid" id="menuGrid">
      <!-- Items will be loaded by JavaScript -->
    </div>
  </section>

  <!-- Cart Overlay -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-cart" id="closeCart">×</button>
    </div>
    <div class="cart-items" id="cartItems">
      <div class="empty-cart">
        <span>🛒</span>
        Your cart is empty
      </div>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">₨ 0</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn" disabled>Proceed to Checkout</button>
    </div>
  </aside>

  <!-- Checkout Modal -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal">
      <h2>Complete Your Order</h2>
      <form id="orderForm">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="customerName" required placeholder="Your full name" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="customerPhone" required placeholder="98XXXXXXXX" />
          </div>
          <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="tel" id="customerWhatsapp" placeholder="Same as phone if empty" />
          </div>
        </div>
        <div class="form-group">
          <label>Delivery Address *</label>
          <textarea id="customerAddress" rows="3" required placeholder="House no, street, area..."></textarea>
        </div>
        <div class="form-group">
          <label>Landmark / Nearby Place</label>
          <input type="text" id="customerLandmark" placeholder="Near temple, school, etc." />
        </div>
        <div class="form-group">
          <label>Coupon Code (optional)</label>
          <input type="text" id="couponCode" placeholder="Enter coupon" />
        </div>
        <button type="submit" class="submit-order-btn">Place Order</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
